name: tuna_chat_flutter
description: Flutter SDK for TunaChat — real-time chat as a service. Pre-built BLoC state management, pages, and widgets. Reactions, threads, file upload, push notifications, search, and read receipts.
version: 0.1.0
# Monorepo: path dependency on tuna_chat. Before publishing to pub.dev,
# replace with a hosted version constraint (tuna_chat: ^0.1.0) and remove publish_to.
publish_to: none
homepage: https://github.com/yunusemrealpak/tuna_flutter
repository: https://github.com/yunusemrealpak/tuna_flutter
issue_tracker: https://github.com/yunusemrealpak/tuna_flutter/issues

environment:
  sdk: ^3.10.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  tuna_chat:
    path: ../tuna_chat
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  get_it: ^8.0.3
  cached_network_image: ^3.4.1
  sqlite3_flutter_libs: ^0.5.29
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  drift: ^2.23.1
  path: ^1.9.1
  file_picker: ^8.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.15
  dartz: ^0.10.1

flutter:
