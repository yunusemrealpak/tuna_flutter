name: chat_core
description: Platform-agnostic core library for the self-hosted Chat SDK. Domain entities, repository interfaces, data sources, offline sync.
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  http: ^1.4.0
  web_socket_channel: ^3.0.2
  drift: ^2.23.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.4.15
  drift_dev: ^2.23.1
  json_serializable: ^6.9.4
  mockito: ^5.4.5
