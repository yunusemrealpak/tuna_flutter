name: tuna_chat
description: Pure Dart core library for TunaChat SDK. Domain entities, repository interfaces, HTTP/WebSocket clients, offline-first Drift/SQLite storage.
version: 0.1.0
homepage: https://github.com/yunusemrealpak/tuna_flutter
repository: https://github.com/yunusemrealpak/tuna_flutter
issue_tracker: https://github.com/yunusemrealpak/tuna_flutter/issues

environment:
  sdk: ^3.10.1

dependencies:
  http: ^1.4.0
  web_socket_channel: ^3.0.2
  drift: ^2.23.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.4.15
  drift_dev: ^2.23.1
  json_serializable: ^6.9.4
  mockito: ^5.4.5
